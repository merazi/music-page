      <h1>How I make my music</h1>
      <p>I'm a <a href="https://www.debian.org/">Debian</a> user (btw), so I use a DAW that's compatible with Linux. That DAW is <a href="https://lmms.io/">LMMS</a>.</p>
      <p>Whenever I want to record anything I just use my phone and then I use <a href="https://www.audacityteam.org/download/">Audacity</a> to cleanup the audio.</p>
